name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throw-away CI-only credentials for an ephemeral container (not a secret).
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: nutriplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan -d nutriplan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://nutriplan:ci_only_password@localhost:5432/nutriplan_test
      TEST_DATABASE_URL: postgresql+psycopg://nutriplan:ci_only_password@localhost:5432/nutriplan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Models and migrations are in sync
        run: python -m alembic check
      - run: python -m pytest

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t nutriplan:ci .
      - name: Image contains the built frontend and refuses to start without a database
        run: |
          docker run --rm --entrypoint test nutriplan:ci -f /app/frontend-dist/index.html
          if docker run --rm nutriplan:ci; then
            echo "Container started without DATABASE_URL" >&2
            exit 1
          fi
