# Render Blueprint: one-click deployment of the NutriPlan web service (Docker).
# The database is external so it does not expire: create a free PostgreSQL database on
# https://neon.tech and paste its connection string as DATABASE_URL when Render asks.
# In the Render dashboard: New > Blueprint > select this repository > Apply.
services:
  - type: web
    name: nutriplan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # e.g. postgresql://user:password@ep-xxxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SEED_CATALOGUE
        value: "1"
      # Render terminates HTTPS in front of the container.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: NUTRIPLAN_ADMIN_EMAIL
        sync: false
      - key: NUTRIPLAN_ADMIN_PASSWORD
        sync: false
