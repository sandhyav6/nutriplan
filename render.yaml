# Render Blueprint: one-click deployment of NutriPlan (Docker web service + PostgreSQL).
# In the Render dashboard: New > Blueprint > select this repository > Apply.
# You will be asked for the two values marked sync: false (the administrator login).
services:
  - type: web
    name: nutriplan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutriplan-db
          property: connectionString
      - key: SEED_CATALOGUE
        value: "1"
      # Render terminates HTTPS in front of the container.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: NUTRIPLAN_ADMIN_EMAIL
        sync: false
      - key: NUTRIPLAN_ADMIN_PASSWORD
        sync: false

databases:
  - name: nutriplan-db
    plan: free
    databaseName: nutriplan
    user: nutriplan
    postgresMajorVersion: "17"
