# Local development database. Start with:  docker compose up -d db
# Credentials come from the root .env file (copy .env.example → .env).
name: nutriplan

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-nutriplan_test}
    ports:
      # Bound to localhost only; host port 5433 avoids clashing with a local PostgreSQL on 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - nutriplan_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production image (Dockerfile) – API + built frontend on http://localhost:8000.
  # Only started with:  docker compose --profile prod up --build
  app:
    profiles: ["prod"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use a URL-safe password in .env (or percent-encode it) since it is embedded in the URL.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Plain-HTTP localhost trial; behind HTTPS leave this unset so cookies are Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"

volumes:
  nutriplan_pgdata:
